[package]
name = "tinabot"
version = "0.0.1"
edition = "2024"

[dependencies]
async-trait = "0.1"
chrono = "0.4.44"
clap = { version = "4.6", features = ["derive", "env"] }
dotenvy = "0.15.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
