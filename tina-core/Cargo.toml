[package]
name = "tinabot"
version = "0.0.1"
edition = "2024"

[dependencies]
tina-plugin-api = { path = "../tina-plugin-api" }
dummy-plugin = { path = "../plugins/dummy-plugin" }
tina-twitch-plugin = { path = "../plugins/twitch" }

chrono = "0.4.44"
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }
mlua = { version = "0.11", features = [
    "lua55",
    "vendored",
    "async",
    "send",
    "serialize",
    "serde",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
regex = "1.12.3"
