[package]
name = "twitch-plugin"
version = "0.0.1"
edition = "2024"

[dependencies]
tina-plugin-api = { path = "../../tina-plugin-api" }

async-trait = "0.1"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
reqwest = { version = "0.13", features = ["json"] }
twitch_oauth2 = { version = "0.17", features = ["reqwest"] }
twitch_api = { version = "0.7", features = [
    "all",
] } # fixme: select only used features
