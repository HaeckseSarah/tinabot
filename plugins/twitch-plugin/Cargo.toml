[package]
name = "twitch-plugin"
version = "0.0.1"
edition = "2024"

[dependencies]
tina-plugin-api = { path = "../../tina-plugin-api" }

async-trait = "0.1"
tokio = { version = "1.52", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.23.1", features = ["serde", "v4"] }
reqwest = { version = "0.13", features = ["json"] }
twitch_oauth2 = { version = "0.17", features = ["reqwest"] }
twitch_api = { version = "0.7", features = [
    "all",
] } # fixme: select only used features

keyring-core = { version = "1.0" }
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.0", features = [
    "keychain",
    "protected",
] }


[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = { version = "1.0.0" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.0", features = [
    "crypto-rust",
    "vendored",
] }
zbus-secret-service-keyring-store = { version = "1.0.0", features = [
    "crypto-rust",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.0.0"
